# Release builds: Windows zip, Debian package and AppImage.
#
# Push a tag like v1.2.0 to build, test and PUBLISH a release whose notes link
# directly to every file. "Run workflow" (workflow_dispatch) builds and
# tests the same way and keeps the files as workflow artifacts, without a release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Same pins as tools/build_linux.py APPIMAGE_REQUIREMENTS.
  PIP_PACKAGES: "cryptography==50.0.2 PySide6==6.12.0 pytest jsonschema pyinstaller==6.22.3 pefile==2024.8.26"
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
      signer: ${{ steps.signature.outputs.signer }}
      thumbprint: ${{ steps.signature.outputs.thumbprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build and test dependencies
        run: python -m pip install ${{ env.PIP_PACKAGES }}
      - name: Test suite
        run: python -m pytest -q
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in 'install_helper.ps1', 'diagnose_windows.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
      - name: Make sure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' }
          }
      - name: Build DriverInstaller-Windows-Portable.zip and DriverInstaller-Setup.exe
        # With both secrets: DriverInstaller.exe is signed (signtool, SHA-256, RFC 3161 timestamp)
        # right after PyInstaller, before it is hashed and zipped; Inno Setup signs Setup.exe and
        # its uninstaller through tools/codesign_windows.py while compiling. Without them (forks)
        # everything is unsigned, with a notice. The decoded .pfx is wiped after every signtool call.
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: python tools/build_windows.py --out dist --setup yes
      - name: Smoke test the portable build
        shell: pwsh
        run: |
          Expand-Archive dist/DriverInstaller-Windows-Portable.zip -DestinationPath smoke
          $app = (Resolve-Path "smoke/DriverInstaller").Path
          $exe = Join-Path $app 'DriverInstaller.exe'
          $top = @(Get-ChildItem -LiteralPath $app -Force | ForEach-Object Name)
          if (Compare-Object $top @('BUILD-INFO.txt', 'DriverInstaller.exe', '_internal')) { throw "unexpected portable layout: $($top -join ', ')" }
          if (-not (Test-Path "$app/_internal/ui/assets/fonts/VT323-Regular.ttf")) { throw "font missing" }
          # CLI with redirected output (scripts, CI): Start-Process waits for a windowed program.
          $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput v.txt -RedirectStandardError e.txt
          "redirected --version: exit $($p.ExitCode): $(Get-Content v.txt)"
          if ($p.ExitCode -ne 0 -or -not ((Get-Content v.txt) -match 'SafeDriver')) { Get-Content e.txt; throw 'CLI output was not redirected' }
          # PowerShell capturing the output of the windowed program
          $captured = & $exe --version 2>&1 | Out-String
          "captured by PowerShell: $captured"
          if ($captured -notmatch 'SafeDriver') { throw 'PowerShell did not capture the CLI output' }
          # elevated-helper mode: refuses an incomplete command line
          $p = Start-Process $exe -ArgumentList '--apply-plan' -Wait -PassThru
          if ($p.ExitCode -ne 64) { throw "helper mode exit code $($p.ExitCode), expected 64" }
          # no arguments = the GUI (here with --demo --screenshot through the gui subcommand)
          $p = Start-Process $exe -ArgumentList 'gui', '--demo', '--screenshot', "$PWD\smoke.png" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.png)) { throw "GUI did not render (exit $($p.ExitCode))" }
      - name: Real cabinets keep their folders and localized output decodes
        # A driver cabinet with sub-folders, made with makecab (LZX, like Windows Update's), must
        # unpack with its tree intact (tar.exe; expand.exe would flatten it), and console output
        # in the OEM code page must decode without replacement characters.
        shell: pwsh
        run: |
          $w = Join-Path $env:RUNNER_TEMP 'cabtest'
          New-Item -ItemType Directory -Force "$w\src\Agent\lang" | Out-Null
          'x' | Set-Content "$w\src\pkg.inf"; 'y' | Set-Content "$w\src\Agent\HpAgent.exe"; 'z' | Set-Content "$w\src\Agent\lang\HpAgent.mui"
          @(".Set CabinetNameTemplate=Maintenance.cab", ".Set DiskDirectoryTemplate=.", ".Set CompressionType=LZX",
            ".Set MaxDiskSize=0", ".Set RptFileName=setup.rpt", ".Set InfFileName=setup.inf",
            ".Set Cabinet=on", ".Set Compress=on", "src\pkg.inf pkg.inf",
            ".Set DestinationDir=Agent", "src\Agent\HpAgent.exe HpAgent.exe",
            ".Set DestinationDir=Agent\lang", "src\Agent\lang\HpAgent.mui HpAgent.mui") | Set-Content "$w\cab.ddf"
          Push-Location $w
          makecab /F cab.ddf
          Pop-Location
          $cab = Get-ChildItem $w -Recurse -Filter Maintenance.cab | Select-Object -First 1
          if (-not $cab) { Get-Content "$w\cab.ddf"; throw 'makecab did not produce a cabinet' }
          if ($cab.FullName -ne "$w\Maintenance.cab") { Move-Item $cab.FullName "$w\Maintenance.cab" }
          @'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path("src").resolve()))
          from core import common, installer
          w = pathlib.Path(sys.argv[1])
          out = w / "out"; out.mkdir()
          installer.unpack_package(w / "Maintenance.cab", "cab", out)
          tree = sorted(str(p.relative_to(out)).replace("\\", "/") for p in out.rglob("*") if p.is_file())
          print("unpacked:", tree)
          assert tree == ["Agent/HpAgent.exe", "Agent/lang/HpAgent.mui", "pkg.inf"], tree
          res = common.run(["pnputil", "/add-driver", str(w / "missing" / "*.inf")])
          print("pnputil rc", res.rc, "output:", (res.stdout + res.stderr).strip()[:200], "OEM", common.oem_codepage())
          assert "\ufffd" not in res.stdout + res.stderr
          '@ | Set-Content -Encoding utf8 "$w\check.py"
          python "$w\check.py" "$w"
          if ($LASTEXITCODE -ne 0) { throw 'cabinet / encoding check failed' }
      - name: Elevated helper reports why it refuses a deferred Windows Update item
        # The real --apply-plan path, as administrator, against the real Windows Update Agent:
        # an update ID Windows does not offer must be refused with the agent's own reason,
        # in the result and in the live log the window replays into LOG.
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'smoke/DriverInstaller/DriverInstaller.exe').Path
          $id = -join (1..32 | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          $uid = '00000000-0000-4000-8000-0000000000c1'
          $plan = @{ plan_id = $id; allow_without_blocklist = $true; allow_without_snapshot = $true
                     items = @(@{ discovered = @{ origin = 'windows-update'; id = "windowsupdate.$uid"; update_id = $uid
                                                  name = 'CI deferred item'; version = '1.0'
                                                  artifact = @{ acquire = 'windows-update-agent' } } }) }
          $planPath = Join-Path $env:RUNNER_TEMP 'plan.json'
          $plan | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $planPath
          $p = Start-Process $exe -ArgumentList '--apply-plan', $planPath -Wait -PassThru
          $results = Join-Path $env:ProgramData 'SafeDriver\results'
          $result = Get-Content (Join-Path $results "$id.json") -Raw | ConvertFrom-Json
          "exit $($p.ExitCode), status $($result.status): $($result.detail)"
          $item = $result.items[0]
          "item: $($item.status): $($item.detail)"
          if ($p.ExitCode -eq 0 -or $result.status -ne 'refused') { throw 'the helper should refuse this item' }
          if ($item.detail -notmatch '^verification before installing: Windows Update download as administrator failed: Windows Update Agent') { throw "unexpected reason: $($item.detail)" }
          $events = @(Get-Content (Join-Path $results "$id.log") | ForEach-Object { ($_ | ConvertFrom-Json).event })
          "live log: $($events -join ', ')"
          foreach ($e in 'helper.start', 'wua.fetch.start', 'wua.fetch.failed', 'helper.refused', 'helper.done') {
            if ($e -notin $events) { throw "the live log lacks $e" }
          }
          if (@($result.log).Count -lt 5) { throw 'the result carries no log for the window' }
      - name: CLI output reaches an interactive console
        # A real console (ConPTY), nothing redirected: the windowed program must attach to the
        # console of the cmd.exe that started it and print there.
        timeout-minutes: 5
        shell: bash
        run: |
          python -m pip install pywinpty==2.0.14
          python - <<'EOF'
          import os, pathlib, threading
          from winpty import PtyProcess

          def capture(command, seconds=60):
              """Run in a pseudo console; read on a thread so a stuck read cannot hang the job."""
              proc, chunks = PtyProcess.spawn(command), []
              def pump():
                  try:
                      while True:
                          chunks.append(proc.read(4096))
                  except EOFError:
                      pass
                  except Exception as exc:
                      chunks.append(f"<read failed: {exc!r}>")
              reader = threading.Thread(target=pump, daemon=True)
              reader.start()
              reader.join(seconds)
              if proc.isalive():
                  proc.terminate(force=True)
                  chunks.append("<still running after %ss, terminated>" % seconds)
              return "".join(chunks)

          exe = pathlib.Path("smoke/DriverInstaller/DriverInstaller.exe").resolve()
          failed = False
          assert " " not in str(exe)       # pywinpty re-escapes quotes, so the commands use none
          for how in (f"start /wait {exe} --version", f"{exe} --version & ping -n 6 127.0.0.1 >nul"):
              out = capture(f"cmd /d /c {how}")
              print(f"{how!r}:\n{out!r}", flush=True)
              failed |= "SafeDriver" not in out
          os._exit(1 if failed else 0)
          EOF
      - name: Verify the Authenticode signatures
        id: signature
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WINDOWS_PFX_BASE64 != '' && secrets.WINDOWS_PFX_PASSWORD != '' }}
        run: |
          $files = (Resolve-Path 'smoke/DriverInstaller/DriverInstaller.exe').Path, (Resolve-Path 'dist/DriverInstaller-Setup.exe').Path
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            "::notice title=Code signing::WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD are not set; DriverInstaller.exe and DriverInstaller-Setup.exe are unsigned."
            foreach ($f in $files) { if ((Get-AuthenticodeSignature -LiteralPath $f).Status -ne 'NotSigned') { throw "$f carries a signature in an unsigned build" } }
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $cert = (Get-AuthenticodeSignature -LiteralPath $files[0]).SignerCertificate
          if (-not $cert) { throw "signing was configured but $($files[0]) is not signed" }
          if ($cert.Subject -eq $cert.Issuer) {
            # A self-signed certificate is trusted nowhere. Trust it on this throwaway runner
            # only, so the checks can require a fully valid chain.
            "::warning title=Code signing::self-signed certificate $($cert.Subject): users must trust the .cer themselves (docs/SIGNING.md)."
            foreach ($store in 'Root', 'TrustedPublisher') {
              $s = [Security.Cryptography.X509Certificates.X509Store]::new($store, 'LocalMachine')
              $s.Open('ReadWrite'); $s.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData)); $s.Close()
            }
          }
          $signtool = python -c "import sys; sys.path.insert(0, 'tools'); import codesign_windows as c; print(c.find_signtool())"
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            $name = Split-Path $f -Leaf
            if ($sig.Status -ne 'Valid') { throw "${name}: signature status $($sig.Status): $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "${name}: signed by a different certificate" }
            if (-not $sig.TimeStamperCertificate) { throw "${name}: signature is not timestamped" }
            $out = & $signtool verify /pa /tw /v $f 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $out; throw "signtool verify failed for $name" }
            if ($out -notmatch 'Hash of file \(sha256\)') { $out; throw "${name}: the file digest is not SHA-256" }
            "${name}: Valid, SHA-256, timestamped by $($sig.TimeStamperCertificate.Subject)"
          }
          "signed=true" >> $env:GITHUB_OUTPUT
          "signer=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Install with DriverInstaller-Setup.exe and run as a standard user
        shell: pwsh
        env:
          SIGNED: ${{ steps.signature.outputs.signed }}
        run: |
          $setup = (Resolve-Path 'dist/DriverInstaller-Setup.exe').Path
          $dest = Join-Path $env:ProgramFiles 'Driver Installer'
          $envKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $link = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Driver Installer.lnk'
          function Install([string]$tasks) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/TASKS=$tasks", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "Setup exited with $($p.ExitCode)" }
          }
          function OnPath { ((Get-ItemProperty $envKey).Path -split ';') -contains $dest }
          Install 'addtopath'
          foreach ($f in 'DriverInstaller.exe', 'driver-installer.cmd', 'unins000.exe', 'BUILD-INFO.txt') { if (-not (Test-Path (Join-Path $dest $f))) { throw "$f was not installed" } }
          if (-not (OnPath)) { throw 'the PATH task did not add the install folder to the system PATH' }
          if (-not (Test-Path $link)) { throw 'no Start menu shortcut' }
          # ACL: only Administrators and SYSTEM may change anything; Users read & execute; nothing inherited.
          $acl = Get-Acl -LiteralPath $dest
          icacls $dest
          if (-not $acl.AreAccessRulesProtected) { throw 'the install folder still inherits permissions' }
          $writeBits = [Security.AccessControl.FileSystemRights]'WriteData, AppendData, WriteExtendedAttributes, WriteAttributes, Delete, ChangePermissions, TakeOwnership'
          foreach ($item in @(Get-Item -LiteralPath $dest) + @(Get-ChildItem -LiteralPath $dest -Recurse -Force)) {
            foreach ($rule in (Get-Acl -LiteralPath $item.FullName).Access | Where-Object AccessControlType -eq 'Allow') {
              $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($sid -notin 'S-1-5-32-544', 'S-1-5-18', 'S-1-5-32-545') { throw "$($item.FullName): unexpected ACE for $($rule.IdentityReference)" }
              if ($sid -eq 'S-1-5-32-545' -and ($rule.FileSystemRights -band $writeBits)) { throw "$($item.FullName): Users can modify it" }
            }
          }
          $marked = @(Get-ChildItem $dest -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          if ($marked.Count) { throw "$($marked.Count) installed file(s) carry the download mark" }
          if ($env:SIGNED -eq 'true') {
            foreach ($f in 'DriverInstaller.exe', 'unins000.exe') {
              $sig = Get-AuthenticodeSignature (Join-Path $dest $f)
              "${f}: $($sig.Status)"
              if ($sig.Status -ne 'Valid') { throw "installed $f signature: $($sig.Status)" }
            }
          }
          # A standard (non-administrator) account. Scheduled tasks, because Start-Process
          # -Credential hangs in the runner's non-interactive session. Every wait has a deadline.
          $pw = 'Di-' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!a1'
          New-LocalUser -Name diuser -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545').Name -Member diuser
          $admins = (Get-LocalGroup -SID 'S-1-5-32-544').Name
          if (Get-LocalGroupMember -Group $admins | Where-Object { $_.Name -like '*\diuser' }) { throw 'test user must not be an administrator' }
          # Scheduled tasks need "Log on as a batch job", which a new account on Windows Server
          # lacks. It is a logon right only: file access is still that of a standard user.
          $sid = (Get-LocalUser diuser).SID.Value
          secedit /export /cfg C:\secpol.cfg /areas USER_RIGHTS | Out-Null
          $cfg = Get-Content C:\secpol.cfg
          if ($cfg -match '^SeBatchLogonRight') { $cfg = $cfg -replace '^(SeBatchLogonRight\s*=\s*)', "`$1*$sid," }
          else { $cfg = $cfg -replace '^\[Privilege Rights\]', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid" }
          $cfg | Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas USER_RIGHTS | Out-Null
          function Invoke-AsUser([string]$name, [string]$command) {
            $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/d /c $command"
            Register-ScheduledTask -TaskName $name -Action $action -User diuser -Password $pw -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName $name
            $deadline = (Get-Date).AddMinutes(3)
            # 267011 (0x41303) = has not run yet; 267009 (0x41301) = running
            do { Start-Sleep 2; $rc = (Get-ScheduledTaskInfo -TaskName $name).LastTaskResult }
            while (($rc -in 267011, 267009 -or (Get-ScheduledTask -TaskName $name).State -eq 'Running') -and (Get-Date) -lt $deadline)
            if ($rc -in 267011, 267009) { Stop-ScheduledTask -TaskName $name; throw ("{0} did not run to completion within 3 minutes (0x{1:X8})" -f $name, $rc) }
            Unregister-ScheduledTask -TaskName $name -Confirm:$false
            return $rc
          }
          $out = 'C:\Users\Public\di-version.txt'
          $rc = Invoke-AsUser 'di-cli' "`"$dest\driver-installer.cmd`" --version > $out 2>&1"
          "standard user, driver-installer.cmd --version: exit $rc, output: $(Get-Content $out -ErrorAction SilentlyContinue)"
          if ($rc -ne 0 -or -not ((Get-Content $out -ErrorAction SilentlyContinue) -match 'SafeDriver')) { throw 'a standard user could not run the CLI' }
          $rc = Invoke-AsUser 'di-rc' "`"$dest\driver-installer.cmd`" --apply-plan"
          "standard user, driver-installer.cmd --apply-plan: exit $rc (64 expected: the shim passes exit codes on)"
          if ($rc -ne 64) { throw "the .cmd shim returned $rc, expected 64" }
          $shot = 'C:\Users\Public\gui-standard-user.png'
          $rc = Invoke-AsUser 'di-gui' "set QT_QPA_PLATFORM=offscreen&& start `"`" /wait `"$dest\DriverInstaller.exe`" gui --demo --screenshot $shot"
          "standard user GUI: exit $rc"
          if ($rc -ne 0 -or -not (Test-Path $shot)) { throw 'a standard user could not start the GUI' }
          $rc = Invoke-AsUser 'di-write' "echo x> `"$dest\written-by-user.txt`""
          if (Test-Path (Join-Path $dest 'written-by-user.txt')) { throw 'a standard user could write into the install folder' }
          "standard user writing into the install folder: refused (exit $rc)"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\diagnose_windows.ps1 -Path $dest
          Remove-LocalUser -Name diuser
          # Upgrade in place without the PATH task, while the program is running from the install
          # folder: Setup must close it (CloseApplications=force), replace its files and lock the
          # folder down again. The shim and the PATH entry go away.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $running = Start-Process (Join-Path $dest 'DriverInstaller.exe') -ArgumentList 'gui', '--demo' -PassThru
          Start-Sleep 8
          if ($running.HasExited) { throw "the GUI did not stay open for the upgrade test (exit $($running.ExitCode))" }
          Install ''
          $env:QT_QPA_PLATFORM = $null
          if (-not $running.WaitForExit(30000)) { Stop-Process $running -Force; throw 'Setup did not close the running program' }
          if (-not (Get-Acl -LiteralPath $dest).AreAccessRulesProtected) { throw 'the upgrade left the folder unprotected' }
          'upgrade while running: program closed, files replaced, folder locked down'
          if (Test-Path (Join-Path $dest 'driver-installer.cmd')) { throw 'the shim stayed after reinstalling without the PATH task' }
          if (OnPath) { throw 'the PATH entry stayed after reinstalling without the PATH task' }
          Install 'addtopath'
          # Uninstall: the uninstaller re-launches itself from %TEMP%, so wait for the files to go.
          Start-Process (Join-Path $dest 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path (Join-Path $dest 'DriverInstaller.exe')) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path (Join-Path $dest 'DriverInstaller.exe')) { throw 'uninstall left DriverInstaller.exe behind' }
          if (OnPath) { throw 'uninstall left the PATH entry behind' }
          if (Test-Path $link) { throw 'uninstall left the Start menu shortcut behind' }
          'install, PATH task, ACL, standard-user CLI/GUI, upgrade and uninstall: OK'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DriverInstaller-Windows-Portable.zip
            dist/DriverInstaller-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnupg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils
      - name: Install build and test dependencies
        run: python -m pip install ${{ env.PIP_PACKAGES }}
      - name: Test suite
        run: python -m pytest -q
      - name: Check shell scripts parse
        run: sh -n tools/install_helper.sh && sh -n tools/pin_key.sh
      - name: Build .deb and AppImage
        run: python tools/build_linux.py all --out dist
      - name: Install and remove the .deb
        run: |
          sudo apt-get install -y -q --no-install-recommends ./dist/driver-installer_*_all.deb
          driver-installer --version
          rc=0; /usr/libexec/driver-installer/driver-installer-helper --bogus || rc=$?
          test "$rc" = 64
          test -f /usr/lib/driver-installer/ui/assets/fonts/VT323-Regular.ttf
          grep -q '/usr/libexec/driver-installer/driver-installer-helper' /usr/share/polkit-1/actions/org.safedriver.driver-installer.policy
          systemd-analyze verify --user /usr/lib/systemd/user/driver-installer.timer || true
          sudo apt-get remove -y -q driver-installer
          test ! -e /usr/bin/driver-installer
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --version
          ./dist/*.AppImage scan --no-discover
          ./dist/*.AppImage gui --demo --screenshot appimage.png
          test -s appimage.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            tools/changelog.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check assets, write checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ needs.windows.outputs.signed }}
          SIGNER: ${{ needs.windows.outputs.signer }}
          THUMBPRINT: ${{ needs.windows.outputs.thumbprint }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          WIN="DriverInstaller-Windows-Portable.zip"
          SETUP="DriverInstaller-Setup.exe"
          DEB="driver-installer_${VERSION}_all.deb"
          APPIMAGE="driver-installer-${VERSION}-x86_64.AppImage"
          # This version's section of CHANGELOG.md goes first ([Unreleased] stands in if it is missing).
          python3 tools/changelog.py "$TAG" > changelog-notes.md
          cd release
          # The links below are built from these names, so the uploads must match them exactly.
          for f in "$SETUP" "$WIN" "$DEB" "$APPIMAGE"; do
            test -f "$f" || { echo "::error::expected asset $f was not built"; ls -la; exit 1; }
          done
          extra=$(ls | grep -vxF -e "$SETUP" -e "$WIN" -e "$DEB" -e "$APPIMAGE" || true)
          test -z "$extra" || { echo "::error::unexpected files: $extra"; exit 1; }
          sha256sum "$SETUP" "$WIN" "$DEB" "$APPIMAGE" | tee SHA256SUMS
          URL="https://github.com/${REPO}/releases/download/${TAG}"
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          size() { du -h "$1" | cut -f1; }
          {
            echo "## What's changed"
            echo
            cat ../changelog-notes.md
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File | Size | SHA-256 |"
            echo "|---|---|---|---|"
            echo "| **Windows installer (x64)** | [$SETUP]($URL/$SETUP) | $(size "$SETUP") | \`$(sum "$SETUP")\` |"
            echo "| **Windows portable (x64)** | [$WIN]($URL/$WIN) | $(size "$WIN") | \`$(sum "$WIN")\` |"
            echo "| **Linux (Debian/Ubuntu)** | [$DEB]($URL/$DEB) | $(size "$DEB") | \`$(sum "$DEB")\` |"
            echo "| **Linux (portable)** | [$APPIMAGE]($URL/$APPIMAGE) | $(size "$APPIMAGE") | \`$(sum "$APPIMAGE")\` |"
            echo "| **Checksums** | [SHA256SUMS]($URL/SHA256SUMS) | | |"
            echo
            echo "- **Windows:** run \`$SETUP\` (installs to Program Files; optional \`driver-installer\` command on PATH), or unzip \`$WIN\` and start \`DriverInstaller.exe\`. The installed copy is protected against changes by other accounts; the portable one elevates itself from wherever you unzipped it."
            echo "- **Debian/Ubuntu:** \`sudo apt install ./$DEB\`"
            echo "- **AppImage:** \`chmod +x $APPIMAGE && ./$APPIMAGE\` (needs FUSE, or set \`APPIMAGE_EXTRACT_AND_RUN=1\`)."
            echo "- Verify downloads with \`sha256sum -c SHA256SUMS\`."
            if [ "$SIGNED" = "true" ]; then
              echo "- \`$SETUP\` and \`DriverInstaller.exe\` are Authenticode-signed by \`$SIGNER\` (thumbprint \`$THUMBPRINT\`). Check with \`Get-AuthenticodeSignature .\\$SETUP\` in PowerShell."
            else
              echo "- The Windows programs are **not** code-signed."
            fi
            echo
          } > ../notes.md
          cat ../notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # Published immediately, so the /releases/download/ links work as soon as the job ends.
          draft: false
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/DriverInstaller-Setup.exe
            release/DriverInstaller-Windows-Portable.zip
            release/driver-installer_*_all.deb
            release/driver-installer-*-x86_64.AppImage
            release/SHA256SUMS
